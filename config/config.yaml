# Model Parameters
input_channels: 1 # number of input channels for model
num_classes: 15   # number of classes to predict
model_scale: s    # allowed values: (n, s, m, l, x)

# Train settings -------------------------------------------------------------------------------------------------------
data: "D:/datasets/AMOS22/radyolo_96_96_96_zscore_float16" # (str) path to data folder containing dataset.yaml
fold: 0 # (int) fold from data splits file to use for training
epochs: 1000 # (int) number of epochs to train for
patience: 300 # (int) epochs to wait for no observable improvement for early stopping of training
batch_size: 2 # (int) number of images per batch
patch_size: {x: 96, y: 96, z: 64} # input patch size stored in x, y, z (width, height, depth) order
normalization: {type: "none"} # Normalization for image intensities. Can be {type: "none"/"zscore"/"255_to_01"/"ct"} to be applied globally or a list of such dicts for each channel. For ct you have to define mean, std, clip_min and clip_max in the dict.
save: True # (bool) save train checkpoints
save_period: -1 # (int) Save checkpoint every x epochs (disabled if < 1)
# device: "cpu" # (int | str | list, optional) device to run on, i.e. cuda device=0 or device=0,1,2,3 or device=cpu
workers: 4 # (int) number of worker threads for data loading
project: "runs" # (str, optional) project name
name: "default" # (str, optional) experiment name, results saved to 'project/name' directory
exist_ok: True # (bool) whether to overwrite existing experiment
optimizer: Adam # (str) optimizer to use, choices=[SGD, Adam, Adamax, AdamW, NAdam, RAdam, RMSProp, auto]
verbose: True # (bool) whether to print verbose output
seed: 0 # (int) random seed for reproducibility
deterministic: False # (bool) whether to enable deterministic mode
resume: True # (bool) resume training from last checkpoint
amp: True # (bool) Automatic Mixed Precision (AMP) training, choices=[True, False], True runs AMP check
use_cudnn_benchmark: True # (bool) Set torch.backends.cudnn.benchmark = True which tests several convolution algorithms and chooses the best one

# Val/Test settings ----------------------------------------------------------------------------------------------------
val: True # (bool) validate/test during training
conf: # (float, optional) object confidence threshold for detection (defaults: 0.1 plotting, 0.001 validation)
iou: 0.2 # (float) intersection over union (IoU) threshold for non-maxiumum suppression (NMS)
nms_time_limit: 0.5 # (float) maximum time in seconds per image for NMS before early exit
max_det: 300 # (int) maximum number of detections per image
half: False # (bool) use half precision (FP16)
plots: True # (bool) save plots and images during train/val
clip_boxes_to_image: True # (bool) clip predicted 3D boxes to image bounds during validation/prediction
validation_plot_projection: "mean" # (literal) projection reduction for validation plots, choices=[max, mean]
validation_plot_image_mode: "default" # (literal) source image for validation plots, choices=[default, channel_difference]
validation_plot_difference_channels: [2, 0] # (list[int]) channels used for difference plots as [minuend, subtrahend]

# Predict settings -----------------------------------------------------------------------------------------------------
source: # (str, optional) source directory for images or videos
augment: True # (bool) apply image augmentation to prediction sources
agnostic_nms: False # (bool) class-agnostic NMS

# Hyperparameters ------------------------------------------------------------------------------------------------------
lr0: 0.01 # (float) initial learning rate (i.e. SGD=1E-2, Adam=1E-3)
lrf: 0.01 # (float) final learning rate (lr0 * lrf)
momentum: 0.937 # (float) SGD momentum/Adam beta1
weight_decay: 0.0005 # (float) optimizer weight decay 5e-4
warmup_epochs: 3.0 # (float) warmup epochs (fractions ok)
warmup_momentum: 0.8 # (float) warmup initial momentum
warmup_bias_lr: 0.1 # (float) warmup initial bias lr
objectness_loss: "bce" # (literal) can be either "bce" (binary cross entropy) or "focal" (focal loss)
tal_topk: 10 # (int) top-k anchors to keep per ground truth for task-aligned assignment
tal_alpha: 0.5 # (float) cls score exponent in task-aligned assignment metric
tal_beta: 1.0 # (float) IoU exponent in task-aligned assignment metric
gamma: 2.0 # (float) quality focal loss gamma (used when objectness_loss="focal")
grad_clip_max_norm: 10.0 # (float) max norm used for gradient clipping
ema_decay: 0.9999 # (float) exponential moving average decay
ema_tau: 2000.0 # (float) EMA ramp-up factor
box: 7.5 # (float) box loss gain
cls: 0.5 # (float) cls loss gain (scale with pixels)
dfl: 100 # (float) dfl loss gain
dfl_reg_max: 1 # (int) DFL histogram size; use 1 for direct box edge regression without DFL
bbox_parametrization: "center_extents" # (literal) bbox prediction format, choices=[ltrb, center_extents]; center_extents requires dfl_reg_max=1
bbox_center_offset_limit: 4 # (float) max absolute anchor-relative center offset for center_extents bbox prediction
mask_gain: 5 # (float) mask loss gain
class_separate_gain: 0.5 # (float) class loss gain for separate softmax classification
nbs: 64 # (int) nominal batch size

# Optional Segmentation Head
segmentation_output: True          # (bool) add segmentation output to model
prototype_masks: 8                 # (int) number of prototype masks for segmentation output
higher_resolution_prototypes: True # (bool) use higher vs. lower resolution prototype masks (half vs. quarter input resolution)

# Detection Head Options
separate_objectness_head: True  # (bool) if True, add a separate objectness output and use CCE loss for class logits
include_stride4_output: False

# Zoom Augmentation
max_zoom: 1.4
min_zoom: 0.7
out_zoom_padding: "constant"
prob_zoom: 0.4
zoom_uniform: false  # if false, enable anisotropic per-axis zoom factors
zoom_augmentation_device: "gpu"  # set to "cpu" or "gpu"

# Mirroring Augmentation
prob_mirroring: 0.5
mirror_axes: ["x", "y", "z"]
mirroring_augmentation_device: "gpu"  # set to "cpu" or "gpu"

# Rotation augmentation
prob_rotation: 0.2
rotation_angle_x: [-15.0, 15.0]
rotation_angle_y: [-15.0, 15.0]
rotation_angle_z: [-15.0, 15.0]
rotation_keep_box_volume: true
rotation_augmentation_device: "gpu"  # set to "cpu" or "gpu"

# Cutout Augmentation
prob_cutout: 0.1
cutout_augmentation_device: "gpu"  # set to "cpu" or "gpu"
cutout_params:   # Cutout params (size_fraction, repeats)
- [0.5, 1]
- [0.25, 2]
- [0.125, 4]

# Intensity augmentation parameters
do_batchgenerators_intensity_augmentation: True
do_intensity_augmentations_per_channel: False
intensity_noise_prob: 0.1
intensity_noise_variance: [0.0, 0.1]
intensity_noise_augmentation_device: "gpu"  # set to "cpu" or "gpu"
intensity_blur_prob: 0.2
intensity_blur_sigma: [0.5, 1.0]
intensity_blur_augmentation_device: "gpu"  # set to "cpu" or "gpu"
intensity_mult_brightness_prob: 0.15
intensity_mult_brightness_range: [0.75, 1.25]
intensity_mult_brightness_augmentation_device: "gpu"  # set to "cpu" or "gpu"
intensity_add_brightness_prob: 0.15
intensity_add_brightness_mu: 0.0
intensity_add_brightness_sigma: 0.4
intensity_add_brightness_augmentation_device: "gpu"  # set to "cpu" or "gpu"
intensity_contrast_prob: 0.15
intensity_contrast_range: [0.75, 1.25]
intensity_contrast_augmentation_device: "gpu"  # set to "cpu" or "gpu"
intensity_lowres_prob: 0.25
intensity_lowres_scale: [0.5, 1.0]
intensity_lowres_augmentation_device: "gpu"  # set to "cpu" or "gpu"
intensity_gamma_prob: 0.4
intensity_gamma_range: [0.7, 1.5]
intensity_gamma_p_invert: 0.25
intensity_gamma_p_retain_stats: 1.0
intensity_gamma_augmentation_device: "gpu"  # set to "cpu" or "gpu"

# GIN augmentation
gin_layers: 4
gin_channels: 2
gin_prob_kernel_size_one: 0.8
gin_prob: 0.3
gin_augmentation_device: "gpu"  # set to "cpu" or "gpu"

# Channel dropout augmentation (drop at most one channel)
channel_dropout_probabilities: [0.0,]  # e.g. [0.6,0.3,0.1] must match channel count
channel_dropout_fill_value: 0.0        # ignored if channel_dropout_use_mean=true
channel_dropout_use_mean: false         # if true, replace dropped channel with its mean
channel_dropout_augmentation_device: "gpu"  # set to "cpu" or "gpu"
