# Data and Output Settings
data: "D:/datasets/AMOS22/radyolo_new_96_96_96_zscore_float16" # (str) path to data folder containing dataset.yaml
fold: 0                    # (int) fold from data splits file to use for training
split_file_name: "data_splits.json" # (str) split file name inside the dataset folder
output_folder_base: "runs" # (str, optional) base folder for experiment outputs
experiment_name: "default" # (str, optional) experiment name, results saved to 'output_folder_base/experiment_name' directory

# General Settings
device: ""                # (str) device to run on, "" for automatic selection, "cpu" for cpu, "0" for cuda device 0
amp: True                 # (bool) Automatic Mixed Precision (AMP) training, choices=[True, False], True runs AMP check
use_cudnn_benchmark: True # (bool) Set torch.backends.cudnn.benchmark = True which tests several convolution algorithms and chooses the best one
workers: 6                # (int) number of dataloader workers per GPU/process; total workers in multi-GPU training = workers * number of GPUs
save: True                # (bool) save train checkpoints
save_period: -1           # (int) Save checkpoint every x epochs (disabled if < 1)
exist_ok: True            # (bool) whether to overwrite existing experiment
resume: True              # (bool) resume training from last checkpoint
seed: 0                   # (int) random seed for reproducibility

# Model Parameters
input_channels: 1 # number of input channels for model
model_scale: s    # allowed values: (n, s, m, l, x)

# Optional Segmentation Head
segmentation_output: True            # (bool) add segmentation output to model
prototype_masks: 8                   # (int) number of prototype masks for segmentation output
prototype_layer: "full_resolution_v2" # (literal) choose one of [higher_resolution, full_resolution, full_resolution_v2, half_resolution]

# Detection Head Options
separate_objectness_head: True # (bool) if True, add a separate objectness output and use CCE loss for class logits
include_stride4_output: False  # (bool) if True, add a detection head on stride 4 level (otherwise only on stride levels 8, 16, 32)

# Global Image-Label Head
enable_image_label_head: False                  # (bool) enable the global image-label head for dataset.yaml image_label_tasks
image_label_head_feature_maps: ["o10", "o16", "o19", "o22"] # (list[literal]) selectable inputs from [o10, o16, o19, o22]
image_label_head_projection_channels: 128      # (int) shared projection width for each selected feature map via 1x1x1 convolutions
image_label_head_mlp_hidden_layers: 1          # (int) number of hidden layers in the shared MLP trunk
image_label_head_mlp_hidden_channels: 256      # (int) width of each hidden MLP layer
image_label_head_dropout: 0.1                  # (float) dropout applied after each hidden MLP layer
image_label_multiclass_cce_gain: 1.0           # (float) gain for multiclass cross-entropy image-label loss; ignored when 0
image_label_multiclass_cce_class_weights: {}   # (dict[str, list[float]]) optional per-task class weights keyed by dataset.yaml image_label_tasks name
image_label_survival_num_bins: 32              # (int) number of monotone survival thresholds per survival task
image_label_survival_mtlr_gain: 1.0            # (float) gain for masked multi-task logistic survival loss; ignored when 0
image_label_survival_cox_gain: 1.0             # (float) gain for Cox partial likelihood on the derived survival risk; ignored when 0

# Hyperparameters
epochs: 1000                      # (int) number of epochs to train for
patience: 300                     # (int) epochs to wait for no observable improvement for early stopping of training
training_mode: "wholeimage"       # (literal) choose "wholeimage" for resized full-image training or "patchwise" for nnU-Net-style patch sampling
patch_size: {x: 96, y: 96, z: 96} # input patch size stored in x, y, z (width, height, depth) order
voxel_size: null                  # optional resampling target in x, y, z: {x: 0.8, y: 0.8, z: 1.5} or null, only used for patchwise training
normalization: {type: "zscore"}     # Normalization for image intensities. Can be {type: "none"/"zscore"/"255_to_01"/"ct"} to be applied globally or a list of such dicts for each channel. For ct you have to define mean, std, clip_min and clip_max in the dict.
apply_preprocessing: False        # (bool) apply patch_size/normalization while loading raw training data; set False for already-preprocessed inputs while still keeping inference metadata
preprocessing_device: "cpu"      # (literal) choose "cpu" for dataset-worker preprocessing or "gpu" to resample/normalize on the training/validation device
foreground_oversampling: 0.0      # (float) extra train-epoch sample fraction to draw from foreground cases, range [0, 1)
background_undersampling: 0.0     # (float) fraction of background-only train cases to remove from each epoch, range [0, 1]
min_box_crop_fraction: 0.5        # (float) minimum fraction of a box volume that must stay inside a sampled patch to keep it
batch_size: 2                     # (int) number of images per GPU/process; effective global batch in multi-GPU training = batch_size * number of GPUs
nominal_batch_size: 14            # (int) nominal effective global batch size used to derive gradient accumulation
optimizer: SGD                    # (str) optimizer to use, choices=[SGD, Adam, Adamax, AdamW, NAdam, RAdam, RMSProp, auto]
initial_learning_rate: 0.0143     # (float) initial learning rate (i.e. SGD=1E-2, Adam=1E-3)
final_learning_rate_ratio: 0.0164 # (float) final learning rate ratio (initial_learning_rate * final_learning_rate_ratio)
momentum: 0.875                   # (float) SGD momentum/Adam beta1
weight_decay: 5.45e-06            # (float) optimizer weight decay
warmup_epochs: 4.4                # (float) warmup epochs
warmup_momentum: 0.72             # (float) warmup initial momentum
warmup_bias_lr: 0.0021            # (float) warmup initial bias learning rate
grad_clip_max_norm: 11.6          # (float) max norm used for gradient clipping
tal_topk: 3                       # (int) initial top-k anchors to keep per ground truth for task-aligned assignment
tal_topk_final: null              # (int) final top-k anchors reached by the TAL schedule
tal_topk_final_epoch: 900         # (int) 1-based epoch at which tal_topk_final is reached; values beyond this keep tal_topk_final
tal_alpha: 1.0                    # (float) class score exponent in task-aligned assignment metric
tal_beta: 1.0                     # (float) IoU exponent in task-aligned assignment metric
ema_decay: 0.997                  # (float) exponential moving average decay
ema_tau: 732                      # (float) EMA ramp-up factor, epochs until full ema_decay is used
objectness_loss: "bce"            # (literal) can be either "bce" (binary cross entropy) or "focal" (focal loss)
gamma: 2.0                        # (float) quality focal loss gamma (used when objectness_loss="focal")
class_loss_gain: 0.5              # (float) classification / objectness loss gain
class_separate_loss_gain: 0.5     # (float) class loss gain for separate softmax classification
mask_loss_gain: 5                 # (float) mask loss gain
box_loss_gain: 7.5                # (float) box loss gain (based on complete IoU (CIoU) loss)
dfl_loss_gain: 100                # (float) DFL loss gain (based on DFL loss, or l1 loss if dfl_reg_max=1)
dfl_reg_max: 1                    # (int) DFL histogram size; use 1 for direct box edge regression without DFL
bbox_center_offset_limit: 4       # (float) max absolute anchor-relative center offset for center_extents bbox prediction
bbox_parametrization: "center_extents" # (literal) bbox prediction format, choices=[ltrb, center_extents]; center_extents requires dfl_reg_max=1

# Validation Settings
val: True                              # (bool) validate/test during training
confidence_threshold_validation: 0.001 # (float) object confidence threshold used for validation metrics/detection postprocessing
nms_iou_threshold: 0.1                 # (float) intersection over union (IoU) threshold for non-maxiumum suppression (NMS)
nms_iou_threshold_candidates: [0.02, 0.04, 0.06, 0.1, 0.15, 0.2] # (list[float]) candidate NMS IoU thresholds evaluated after training; results are written to nms_optimization.csv
agnostic_nms: False                    # (bool) class-agnostic NMS
max_det: 300                           # (int) maximum number of detections per image
clip_boxes_to_image: True              # (bool) clip predicted 3D boxes to image bounds during validation/prediction
fitness_metric_weights: [0.4, 0.4, 0.2] # (list[float]) weights for [mAP10-95, mAP10-95Agn, dice] when computing EMA fitness

# Plot Settings
plots: True                                 # (bool) save plots and images during train/val
validation_plot_projection: "mean"          # (literal) projection reduction for validation plots, choices=[max, mean]
validation_plot_image_mode: "default"       # (literal) source image for validation plots, choices=[default, channel_difference]
validation_plot_difference_channels: [2, 0] # (list[int]) channels used for difference plots as [minuend, subtrahend]
confidence_threshold_plotting: 0.1          # (float) object confidence threshold used when rendering validation plots

# Zoom Augmentation
max_zoom: 1.4
min_zoom: 0.7
out_zoom_padding: "constant"
prob_zoom: 0.4
zoom_uniform: false  # if false, enable anisotropic per-axis zoom factors
zoom_augmentation_device: "gpu"  # set to "cpu" or "gpu"

# Mirroring Augmentation
prob_mirroring: 0.5
mirror_axes: ["x", "y", "z"]
mirroring_augmentation_device: "gpu"  # set to "cpu" or "gpu"

# Rotation augmentation
prob_rotation: 0.2
rotation_angle: 15
rotation_keep_box_volume: true
rotation_augmentation_device: "gpu"  # set to "cpu" or "gpu"

# Cutout Augmentation
prob_cutout: 0.1
cutout_augmentation_device: "gpu"  # set to "cpu" or "gpu"
cutout_params:   # Cutout params (size_fraction, repeats)
- [0.5, 1]
- [0.25, 2]
- [0.125, 4]

# Intensity Augmentation Parameters
do_batchgenerators_intensity_augmentation: True
do_intensity_augmentations_per_channel: False
intensity_noise_prob: 0.1
intensity_noise_variance: [0.0, 0.1]
intensity_noise_augmentation_device: "gpu"  # set to "cpu" or "gpu"
intensity_blur_prob: 0.2
intensity_blur_sigma: [0.5, 1.0]
intensity_blur_augmentation_device: "gpu"  # set to "cpu" or "gpu"
intensity_mult_brightness_prob: 0.15
intensity_mult_brightness_range: [0.75, 1.25]
intensity_mult_brightness_augmentation_device: "gpu"  # set to "cpu" or "gpu"
intensity_add_brightness_prob: 0.15
intensity_add_brightness_mu: 0.0
intensity_add_brightness_sigma: 0.4
intensity_add_brightness_augmentation_device: "gpu"  # set to "cpu" or "gpu"
intensity_contrast_prob: 0.15
intensity_contrast_range: [0.75, 1.25]
intensity_contrast_augmentation_device: "gpu"  # set to "cpu" or "gpu"
intensity_lowres_prob: 0.25
intensity_lowres_scale: [0.5, 1.0]
intensity_lowres_augmentation_device: "gpu"  # set to "cpu" or "gpu"
intensity_gamma_prob: 0.4
intensity_gamma_range: [0.7, 1.5]
intensity_gamma_p_invert: 0.25
intensity_gamma_p_retain_stats: 1.0
intensity_gamma_augmentation_device: "gpu"  # set to "cpu" or "gpu"

# GIN Augmentation
gin_layers: 4
gin_channels: 2
gin_prob_kernel_size_one: 0.8
gin_prob: 0.3
gin_augmentation_device: "gpu"  # set to "cpu" or "gpu"

# Channel Dropout Augmentation (drop at most one channel)
channel_dropout_probabilities: []      # e.g. [0.6,0.3,0.1] must be empty or match channel count
channel_dropout_fill_value: 0.0        # ignored if channel_dropout_use_mean=true
channel_dropout_use_mean: false         # if true, replace dropped channel with its mean
channel_dropout_augmentation_device: "gpu"  # set to "cpu" or "gpu"
