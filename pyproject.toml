[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yolo11-3d"
version = "0.1.0.dev20250624"
authors = [
  { name = "Laurens Müller-Groh", email = "laurens.mueller-groh@mevis.fraunhofer.de" },
]
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "batchgeneratorsv2>=0.3.0",
  "click>=8.1.8",
  "nibabel>=5.3.2",
  "numpy>=2.2.1",
  "onnx>=1.17.0",
  "onnxscript>=0.1.0.dev20250114",
  "opencv-python-headless>=4.11.0.86",
  "pandas>=2.2.3",
  "pillow>=9.2.0",
  "pydantic>=2.10.6",
  "pyyaml>=6.0.2",
  "seaborn>=0.13.2",
  "torch>=2.5.1",
  "torchvision>=0.20.1",
  "tqdm>=4.67.1",
  "tqdm-loggable>=0.2",
]

[project.scripts]
"yolo11-3d" = "yolo11_3d:main"

[dependency-groups]
dev = ["jupyter>=1.1.1", "matplotlib>=3.10.0", "ruff>=0.8.6"]

[tool.uv]
package = true
managed = true

[tool.uv.sources]
torch = [{ index = "pytorch" }]
torchvision = [{ index = "pytorch" }]

[[tool.uv.index]]
name = "pytorch"
# url = "https://download.pytorch.org/whl/cu128"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/yolo11_3d"]

[tool.ruff]
line-length = 100
required-version = ">=0.8.6"
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ERA001", # auto-removal of commented out code affects development and vscode integration
  "FBT001", # we like to use booleans as function parameters
  "FBT002", # ^^^
  "FBT003", # ^^^
  "TD003",  # we do not work with issues
  "D10",    # document later, or so they said...
  # "TRY",
  "COM812", # we use the magic trailing comma
  "S311",   # we have no requirements for cryptographically secure randomness
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.mccabe]
max-complexity = 15
