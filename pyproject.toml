[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "radyolo"
version = "0.2.0"
authors = [
  { name = "Laurens Müller-Groh", email = "laurens.mueller-groh@mevis.fraunhofer.de" },
  { name = "Kai Geissler", email = "kai.geissler@mevis.fraunhofer.de" },
]
description = "A library to train RadYOLO, a 3D YOLO11-based deep learning model for object detection, classification and segmentation in medical images."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "blosc2>=4.1.0",
  "batchgeneratorsv2>=0.3.2",
  "click>=8.1.8",
  "nibabel>=5.4.1",
  "numpy>=2.4.4",
  "onnx>=1.21.0",
  "onnxconverter-common>=1.16.0",
  "onnxscript>=0.6.2",
  "opencv-python-headless>=4.11.0.86",
  "pandas>=3.0.2",
  "pillow>=9.2.0",
  "pydantic>=2.10.6",
  "pyyaml>=6.0.2",
  "seaborn>=0.13.2",
  "torch>=2.11.0",
  "tqdm>=4.67.1",
  "tqdm-loggable>=0.4.1",
]

[project.scripts]
"radyolo" = "radyolo:main"

[dependency-groups]
dev = [
  "jupyter>=1.1.1",
  "matplotlib>=3.10.0",
  "onnxruntime>=1.22.0",
  "ruff>=0.13.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "pytest-html>=4.2.0",
  "ray[tune]==2.51.2",
]

[tool.uv]
package = true
managed = true

[tool.uv.sources]
torch = [{ index = "pytorch" }]
torchvision = [{ index = "pytorch" }]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["radyolo"]

[tool.ruff]
line-length = 100
required-version = ">=0.13.0"
src = ["."]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ERA001",  # auto-removal of commented out code affects development and vscode integration
  "FBT001",  # we like to use booleans as function parameters
  "FBT002",  # ^^^
  "FBT003",  # ^^^
  "G004",    # Allow f-strings in logging messages
  "TD003",   # we do not work with issues
  "D10",     # document later, or so they said...
  "COM812",  # we use the magic trailing comma
  "PLR2004", # Allow magic constant numbers
  "S101",    # Allow asserts
  "S311",    # we have no requirements for cryptographically secure randomness
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 7