image: python:3.12-slim

stages:
  - test

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy

cache:
  key:
    files:
      - pyproject.toml
      - uv.lock
  paths:
    - .uv-cache/
    - .venv/

before_script:
  - python -m pip install --upgrade pip
  - python -m pip install uv

test:
  stage: test
  tags:
    - mevis-runner
  script:
    - uv sync --locked --group dev
    - uv run --group dev pytest --junitxml=pytest-report.xml --html=pytest-report.html --self-contained-html --cov=radyolo --cov-report=term --cov-report=xml --cov-report=html
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: pytest-report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - pytest-report.xml
      - pytest-report.html
      - coverage.xml
      - htmlcov/